name: Feature request
description: Suggest an idea for BitJarvis.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like BitJarvis to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help you?
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Ideas for how it could work, examples from other apps, sketches.
